name: Ruliweb Crawler

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Action 오타 수정 (python-python -> setup-python)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # 2. Secret 이름 변경 (FIGURE_DISCORD_WEBHOOK_URL)
      - name: Run Crawler
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.FIGURE_DISCORD_WEBHOOK_URL }}
        run: python check_ruliweb.py

      - name: Commit and Push notified IDs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notified_ids.txt || exit 0
          git commit -m "Update notified IDs" || exit 0
          git push
